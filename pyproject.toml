[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micronmt"
version = "0.1.0"
dependencies = ["torch>=2.1", "pyyaml>=6", "numpy>=1.24"]

[project.optional-dependencies]
train = ["sentencepiece>=0.1.99", "sacrebleu>=2.4", "onnx>=1.15", "onnxruntime>=1.16"]
data = ["datasets>=2.18", "langdetect>=1.0.9"]
quality = ["unbabel-comet>=2.2"]

[tool.setuptools.packages.find]
include = ["micronmt*"]
